<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="index.css">
    
</head>
<body>
    <div class="bg-container">
        <div class="quiz-container">
            <h1>Quiz Application for INDIGG</h1>
            <div class="question">
                <p id="question-text"></p>
            </div>
            <div class="options">
                <label><input type="radio" name="options" value="0"> <span id="option0"></span></label>
                <label><input type="radio" name="options" value="1"> <span id="option1"></span></label>
                <label><input type="radio" name="options" value="2"> <span id="option2"></span></label>
                <label><input type="radio" name="options" value="3"> <span id="option3"></span></label>
            </div>
           <div class="button-items">
            <button id="submit-button">Submit</button>
            <button id="next-button">Next</button>
           </div>
            
            <p id="result"></p>
            <p id="score"></p>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
